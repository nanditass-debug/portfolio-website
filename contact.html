<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nandita Singh Samanta | Web Developer Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <meta name="description"
        content="Personal Portfolio of Nandita Singh Samanta showcasing projects , skills , achievements and contact information">
  <meta name="keywords"
        content="Portfolio , web developer , Frontend Developer , HTML5 , CSS3 , JavaScript">
  <meta name="author"
        content="Nandita Singh Samanta">
  <meta name="robots"
        content="index,follow">         
</head>
<body class="contact-page">
  <header role="banner">
    <nav aria-label="Main Navigation">
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html" class="active">About</a></li>
        <li><a href="projects.html" class="active">Projects</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section aria-labelledby="contact-heading">
        <h1 id="contact-heading">CONTACT ME</h1>
        <form id="contactForm">
            <input type="text" id="name" placeholder="Your Name" required>
            <input type="email" id="email" placeholder="Your Email" required>
            <textarea id="message" placeholder="Your Message" required></textarea>

            <button type="submit">Send</button>
        </form>
    </section>
  </main>
  <footer>
    <p>
      &copy; Nandita Singh Samanta
    </p>
  </footer>
</body>
<script>
document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: document.getElementById("name").value,
    email: document.getElementById("email").value,
    message: document.getElementById("message").value
  };

  const res = await fetch("http://localhost:5000/api/contact", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(data)
  });

  const result = await res.json();
  alert(result.message);
});
</script>
</html>
